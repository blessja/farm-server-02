[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  # EXPO_PUBLIC_* values are intentionally inlined into the client bundle,
  # and PORT/NODE_ENV values match common strings throughout node_modules.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_API_URL,EXPO_PUBLIC_DEVICE_NAME,PORT,NODE_ENV"
