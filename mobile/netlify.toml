[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  # These are public configuration values or common build strings, not secrets.
  # Expo intentionally inlines EXPO_PUBLIC_* values into the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_API_URL,EXPO_PUBLIC_DEVICE_NAME,NODE_ENV,PORT"
